<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"
      integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <title>Lomba Invention 2026 Tim B</title>
  </head>

  <body class="h-[10000px]">
    <div class="">
      
    </div>
    <button
      class="relative overflow-hidden border-2 border-emerald-600 text-emerald-600 font-medium px-6 py-3 rounded-lg transition-colors duration-300 group hover:text-white"
    >
      <!-- Layer Warna Latar yang Menyapu -->
      <span
        class="absolute inset-0 bg-emerald-600 -translate-x-full group-hover:translate-x-0 transition-transform duration-300 ease-in-out"
      ></span>

      <!-- Teks Tombol (z-10 agar tetap berada di atas layer warna) -->
      <span class="relative z-10">Hover Saya</span>
    </button>

    <script>
      let targetY = window.scrollY,
        currentY = window.scrollY;
      const ease = 0.065; // Makin kecil angkanya (misal 0.05), makin "berat/mewah" luncurannya

      window.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault(); // Matikan scroll kaku bawaan browser
          targetY += e.deltaY;
          targetY = Math.max(
            0,
            Math.min(targetY, document.body.scrollHeight - window.innerHeight),
          );
        },
        { passive: false },
      );

      function smoothScroll() {
        currentY += (targetY - currentY) * ease;
        window.scrollTo(0, currentY);
        requestAnimationFrame(smoothScroll); // Animasi 60-120 FPS
      }

      smoothScroll();
    </script>
  </body>
</html>
