<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <title>Lomba Invention 2026 Tim B</title>
  </head>

  <body class="h-[10000px]">
    <button
      class="relative overflow-hidden border-2 border-emerald-600 text-emerald-600 font-medium px-6 py-3 rounded-lg transition-colors duration-300 group hover:text-white"
    >
      <!-- Layer Warna Latar yang Menyapu -->
      <span
        class="absolute inset-0 bg-emerald-600 -translate-x-full group-hover:translate-x-0 transition-transform duration-300 ease-in-out"
      ></span>

      <!-- Teks Tombol (z-10 agar tetap berada di atas layer warna) -->
      <span class="relative z-10">Hover Saya</span>
    </button>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    ></script>

    <script src="data.js"></script>
    <script src="./smooth-scroll/smooth.js"></script>
    <script src="./smooth-scroll/smooth-tombol.js"></script>
  </body>
</html>
