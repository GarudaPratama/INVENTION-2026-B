<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icon2.png"
      class="object-cover"
    />
    <title>Artikel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --font-karla: "Karla", sans-serif;
        --font-rubik: "Rubik", sans-serif;
      }

      body {
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
      }
      body.ready {
        opacity: 1;
      }

      .reveal {
        opacity: 0;
        transform: translateY(50px);
        transition:
          opacity 0.8s ease-out,
          transform 0.8s ease-out;
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body class="bg-[#F9F9F9]">
    <div
      id="navbar"
      class="fixed top-0 left-0 right-0 z-50 bg-transparent transition-all duration-500 ease-in-out pb-3"
    ></div>

    <section
      class="px-20 py-10 mt-24 min-h-[70vh] max-md:px-8 max-sm:px-4 max-sm:py-6 max-sm:mt-16"
    >
      <!-- Breadcrumbs Navigation (Sejajar Rata Kiri dengan Teks) -->
      <nav
        class="reveal max-w-[1200px] mx-auto mb-8 flex items-center justify-start gap-2 text-sm font-karla text-[#213D34]/70"
      >
        <a
          href="/index.html"
          class="hover:text-[#213D34] hover:underline transition-colors flex items-center gap-1"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
          Beranda
        </a>
        <span class="text-[#213D34]/40">/</span>
        <span class="font-bold text-[#213D34]">Artikel</span>
      </nav>

      <!-- Bagian Header & Search -->
      <div class="reveal max-w-[1200px] mx-auto max-sm:w-full">
        <span
          class="inline-block bg-[#D9EF78] text-[#213D34] font-semibold text-[15px] px-4 py-1.5 rounded-full mb-2 font-karla"
        >
          Artikel Edukasi
        </span>

        <h1
          class="font-rubik font-bold text-[52px] text-[#213D34] max-md:text-[44px] max-sm:text-[36px] max-sm:leading-tight"
        >
          Penjelasan Tentang Mitos-Mitos yang Beredar
        </h1>

        <div class="relative w-full mt-6 max-sm:mt-5">
          <input
            type="text"
            id="searchArtikel"
            placeholder="Cari artikel..."
            class="w-full h-[50px] rounded-full px-16 pr-14 font-karla text-[16px] text-[#213D34] outline-none bg-[#F1F2ED] focus:border-2 border-[#213D34]"
          />

          <button
            type="button"
            class="absolute left-2 top-1/2 -translate-y-1/2 w-[40px] h-[40px] bg-[#F9F9F9] rounded-full flex items-center justify-center text-[#213D34]"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
          </button>

          <button
            type="button"
            id="clearSearch"
            class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-[#213D34]"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="icon icon-tabler icons-tabler-filled icon-tabler-x"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path
                d="M6.707 5.293l5.293 5.292l5.293 -5.292a1 1 0 0 1 1.414 1.414l-5.292 5.293l5.292 5.293a1 1 0 0 1 -1.414 1.414l-5.293 -5.292l-5.293 5.292a1 1 0 1 1 -1.414 -1.414l5.292 -5.293l-5.292 -5.293a1 1 0 0 1 1.414 -1.414"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Bagian Daftar Artikel (max-lg:grid-cols-2 untuk Tablet 768px) -->
      <div
        id="daftarArtikel"
        class="reveal max-w-[1200px] mx-auto grid grid-cols-3 gap-6 mt-12 max-lg:grid-cols-2 max-sm:grid-cols-1 max-sm:gap-4 max-sm:mt-10"
      >
        <!-- Hasil render dari Javascript masuk ke sini -->
      </div>

      <!-- Pagination -->
      <div
        class="reveal flex gap-6 justify-center mt-12 mb-12 max-sm:gap-2 max-sm:mt-10 max-sm:mb-8"
      >
        <p class="font-rubik font-bold bg-[#F1F2ED] px-4 py-2 text-[#2C4A3B] text-[22px] hover:bg-[#D9EF78] transition duration-300 rounded-[10px] max-sm:text-[18px]">1</p>
        <p class="font-rubik font-bold bg-[#F1F2ED] px-4 py-2 text-[#2C4A3B] text-[22px] hover:bg-[#D9EF78] transition duration-300 rounded-[10px] max-sm:text-[18px]">2</p>
        <p class="font-rubik font-bold bg-[#F1F2ED] px-4 py-2 text-[#2C4A3B] text-[22px] hover:bg-[#D9EF78] transition duration-300 rounded-[10px] max-sm:text-[18px]">3</p>
        <p class="font-rubik font-bold bg-[#F1F2ED] px-4 py-2 text-[#2C4A3B] text-[22px] hover:bg-[#D9EF78] transition duration-300 rounded-[10px] max-sm:text-[18px]">4</p>
        <button
          class="relative inline-flex items-center justify-center px-4 py-2 overflow-hidden font-rubik font-bold text-[22px] text-[#2C4A3B] bg-[#D9EF78] border-0 rounded-[10px] transition duration-300 ease-out group cursor-pointer max-sm:px-3 max-sm:py-2 max-sm:text-[18px]"
        >
          <span class="absolute inset-0 flex items-center justify-center w-full h-full text-[#D9EF78] duration-700 -translate-x-full bg-[#213D34] group-hover:translate-x-0 ease">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M5 12l14 0" />
              <path d="M15 16l4 -4" />
              <path d="M15 8l4 4" />
            </svg>
          </span>
          <span class="absolute flex items-center justify-center w-full h-full text-[#2C4A3B] font-rubik font-bold transition-all duration-700 transform group-hover:translate-x-full ease">Lanjut</span>
          <span class="relative invisible font-rubik font-bold">Lanjut</span>
        </button>
      </div>
    </section>

    <!-- Footer -->
    <footer
      class="w-full mt-auto text-[#D9EF78] pt-8 pb-8 px-16 bg-transparent relative max-md:px-8"
      style="
        background-image: url('../assets/FOOTER.png');
        background-size: cover;
        background-repeat: repeat;
        background-position: center;
      "
    >
      <div class="w-full">
        <!-- Struktur footer disederhanakan untuk contoh agar tidak terlalu panjang, gunakan footer Anda yang asli -->
        <p class="text-right font-karla font-bold text-[16px] mt-6 border-t-2 border-[#D9EF78] pt-6">
          © 2026 Gizify. Semua hak dilindungi undang-undang.
        </p>
      </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="artikel.js"></script>
    <script src="../smooth-scroll/smooth.js"></script>
  </body>
</html>
