<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title id="page-title">Detail Artikel</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --font-karla: "Karla", sans-serif;
        --font-rubik: "Rubik", sans-serif; 
      }

      /* Style untuk animasi scroll reveal */
      .reveal {
        opacity: 0;
        transform: translateY(50px);
        transition: opacity 0.8s ease-out, transform 0.8s ease-out;
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
</head>
<body class="bg-[#F1F2ED] text-[#213D34] p-8">

  <a href="artikel.html" class="reveal inline-block mb-6 font-bold">← Kembali ke Daftar</a>

  <article class="reveal max-w-3xl mx-auto bg-white p-8 rounded-3xl shadow-lg">
    <h1 id="article-title" class="text-4xl font-bold mb-4">Judul Loading...</h1>
    <img id="article-image" src="" alt="" class="w-full h-64 object-cover rounded-2xl mb-6 hidden">
    <div id="article-content" class="text-lg leading-relaxed space-y-4">
      <!-- Isi artikel akan masuk ke sini -->
    </div>
  </article>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="artikel.js"></script>
</body>
</html>
