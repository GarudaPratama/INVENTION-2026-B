<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator BMI & BMR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style type="text/tailwindcss">
        @theme {
            --font-karla: "Karla", sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 font-karla text-gray-800 antialiased min-h-screen flex flex-col">
    
    <!-- Tempat Navbar Loaded -->
    <div id="navbar-container"></div>

    <main class="flex-1 max-w-xl w-full mx-auto p-4 md:p-6 my-6">

        <div class="mb-6">
            <a
                href="/index.html"
                class="relative inline-flex items-center justify-center gap-2 overflow-hidden border-2 border-[#213D34] text-[#213D34] font-medium rounded-[24px] font-karla transition-colors duration-300 group px-6 h-[48px] hover:text-white"
            >
                <span
                class="absolute inset-0 bg-[#213D34] -translate-x-full group-hover:translate-x-0 transition-transform duration-700 ease-in-out"
                ></span>

                <span class="relative z-10 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                Kembali ke Beranda
                </span>
            </a>
        </div>

        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100">
            <h1 class="text-2xl font-bold text-[#213D34] mb-2 text-center">Kalkulator BMI & BMR</h1>
            <p class="text-xs text-gray-500 text-center mb-6">Cek status berat badan dan kalori dasar tubuhmu</p>

            <form class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Jenis Kelamin</label>
                    <select id="inputGender" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#213D34] text-sm">
                        <option value="pria">Pria</option>
                        <option value="wanita">Wanita</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Berat Badan (kg)</label>
                        <input type="number" id="inputBerat" placeholder="Contoh: 65" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#213D34] text-sm" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tinggi Badan (cm)</label>
                        <input type="number" id="inputTinggi" placeholder="Contoh: 170" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#213D34] text-sm" />
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Umur (Tahun)</label>
                    <input type="number" id="inputUmur" placeholder="Contoh: 22" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#213D34] text-sm" />
                </div>

                <button id="btnBmi" type="button" class="w-full mt-2 py-3.5 bg-[#213D34] text-white font-semibold rounded-2xl hover:bg-[#182e27] transition-colors shadow-sm cursor-pointer">
                    Hitung Sekarang
                </button>
            </form>

            <div id="resultSection" class="hidden mt-8 pt-6 border-t border-gray-100">
                <div id="resultCard" class="p-6 rounded-2xl border text-center transition-all">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Hasil Indeks Massa Tubuh</span>
                    <div id="bmiResult" class="text-4xl font-extrabold my-2">0.0</div>
                    <div id="bmiCategory" class="text-sm font-semibold mb-4">Normal</div>

                    <div class="bg-white/80 p-3 rounded-xl border border-black/5 text-xs text-gray-600 my-4">
                        🔥 BMR (Kalori Dasar Minimal): <strong id="bmrResult" class="text-gray-900">0 kcal/hari</strong>
                    </div>

                    <!-- Path ke gizi.html dari bmi/ -->
                    <a id="buttonToGizi" href="../kalkulatorgizi/gizi.html" class="inline-block w-full py-3 bg-[#213D34] text-white font-medium rounded-xl hover:opacity-95 transition-opacity text-sm">
                        Lihat Rekomendasi Makanan Gizi &rarr;
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Library & Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" crossorigin="anonymous"></script>

    <script src="../navigasi/navbar.js"></script>

    <script src="./bmi.js"></script>

    <script src="../smooth-scroll/smooth.js"></script>
    <script src="../smooth-scroll/smooth-tombol.js"></script>
</body>
</html>
