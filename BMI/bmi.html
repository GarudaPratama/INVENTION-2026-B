<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator BMI & BMR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --font-karla: "Karla", sans-serif;
        --font-rubik: "Rubik", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">
    <!-- Tempat Navbar Loaded -->
    <div id="navbar-container"></div>

    <main class="flex-1 max-w-[1080px] w-full mx-auto p-4 md:p-6 my-6">
      <div class="flex justify-center gap-14 items-center">
        <!-- kolom kiri bagian deskripsi -->
        <div>
          <span
            class="inline-block bg-[#D9EF78] text-[#213D34] font-semibold text-[15px] px-4 py-1.5 rounded-full mb-4 font-karla"
          >
            Kalkulator BMI
          </span>
          <h1
            class="text-[76px] font-rubik text-[#213D34] font-extrabold w-[585px] leading-tight"
          >
            Yuk, Cek Berat Idealmu!
          </h1>

          <p
            class="mt-4 text-[18px] font-karla text-[#213D34] font-medium leading-relaxed max-w-[600px]"
          >
            Hitung status BMI dan kebutuhan kalori harianmu secara instan, lalu
            dapatkan rekomendasi gizi yang tepat dari Gizify.
          </p>

          <a
            href="/index.html"
            class="relative inline-flex items-center justify-center gap-2 overflow-hidden border-2 border-[#213D34] text-[#213D34] font-medium rounded-[24px] font-karla transition-colors duration-300 group px-6 h-[48px] mt-4 hover:text-white"
          >
            <span
              class="absolute inset-0 bg-[#213D34] -translate-x-full group-hover:translate-x-0 transition-transform duration-700 ease-in-out"
            ></span>

            <span class="relative z-10 flex items-center gap-2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2.5"
                stroke="currentColor"
                class="w-4 h-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
                />
              </svg>
              Kembali ke Beranda
            </span>
          </a>
        </div>

        <!-- bagian kanan : imput nama -->
        <div class="flex-1 w-full">
          <form class="flex flex-col gap-4">
            <!-- Box 1: Jenis Kelamin -->
            <div
              class="border-2 border-[#213D34] rounded-[25px] p-5 flex flex-col gap-2"
            >
              <label
                class="font-bold text-[12px] text-[#213D34] uppercase font-rubik"
                >Jenis Kelamin</label
              >
              <select
                id="inputGender"
                class="w-full bg-[#D9EF78] border-2 border-[#213D34] rounded-full px-5 py-2.5 font-medium text-[15px] text-[#213D34] outline-none cursor-pointer uppercase"
              >
                <option value="pria">Pria</option>
                <option value="wanita">Wanita</option>
              </select>
            </div>

            <!-- Box 2: Berat & Tinggi Badan -->
            <div class="bg-[#D9EF78] rounded-[25px] p-5 flex flex-row gap-4">
              <div class="flex-1 flex flex-col gap-1.5">
                <label
                  class="font-bold text-[12px] text-[#213D34] uppercase font-rubik"
                  >Berat Badan (KG)</label
                >
                <input
                  type="number"
                  id="inputBerat"
                  placeholder="Contoh : 55"
                  class="w-full bg-transparent border-2 border-[#213D34] rounded-full px-5 py-2.5 font-medium text-[15px] text-[#213D34] placeholder-gray-500 outline-none"
                />
              </div>

              <div class="flex-1 flex flex-col gap-1.5">
                <label
                  class="font-bold text-[12px] text-[#213D34] uppercase font-rubik"
                  >Tinggi Badan (CM)</label
                >
                <input
                  type="number"
                  id="inputTinggi"
                  placeholder="Contoh : 170"
                  class="w-full bg-transparent border-2 border-[#213D34] rounded-full px-5 py-2.5 font-medium text-[15px] text-[#213D34] placeholder-gray-500 text-[#213D34] outline-none"
                />
              </div>
            </div>

            <!-- Box 3: Umur -->
            <div class="bg-[#F1F2ED] rounded-[25px] p-5 flex flex-col gap-1.5">
              <label
                class="font-bold text-[12px] text-[#213D34] uppercase font-rubik"
                >Umur (Tahun)</label
              >
              <input
                type="number"
                id="inputUmur"
                placeholder="Contoh : 20"
                class="w-full bg-transparent border-2 border-[#213D34] rounded-full px-5 py-2.5 font-medium text-[15px] text-[#213D34] placeholder-gray-500 outline-none"
              />
            </div>

            <!-- Tombol Submit -->
            <button
              type="button"
              id="btnBmi"
              class="relative inline-flex items-center justify-center gap-2 overflow-hidden self-center border-2 border-[#213D34] text-[#213D34] font-bold text-[15px] rounded-full font-karla transition-colors duration-300 group px-10 py-3 mt-2 shadow-sm cursor-pointer hover:text-white"
            >
              <span
                class="absolute inset-0 bg-[#213D34] -translate-x-full group-hover:translate-x-0 transition-transform duration-700 ease-in-out"
              ></span>

              <span class="relative z-10"> Hitung Sekarang </span>
            </button>
          </form>
        </div>
      </div>

      <!-- RESULT SECTION (MELEBAR FULL LAYAR/CONTAINER) -->
      <div
        id="resultSection"
        class="hidden w-full bg-[#F1F2ED] rounded-3xl p-10 mt-6"
      >
        <div class="flex items-center justify-center gap-12">
          <!-- Avatar Icon -->
          <div class="flex-shrink-0">
            <!-- Avatar Pria -->
            <svg
              id="avatarMale"
              class="w-36 h-36 text-[#213D34]"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <circle cx="12" cy="4" r="3" />
              <path
                d="M12 8c-3.31 0-6 2.69-6 6v1c0 .55.45 1 1 1h1v5c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2v-5h1c.55 0 1-.45 1-1v-1c0-3.31-2.69-6-6-6z"
              />
            </svg>

            <!-- Avatar Wanita -->
            <svg
              id="avatarFemale"
              class="w-36 h-36 text-[#213D34] hidden"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <circle cx="12" cy="4" r="3" />
              <path
                d="M12 8c-2.76 0-5 2.24-5 5v1c0 .55.45 1 1 1h.5l-1.3 5.2c-.22.88.45 1.8 1.36 1.8h6.88c.91 0 1.58-.92 1.36-1.8L15.5 15h.5c.55 0 1-.45 1-1v-1c0-2.76-2.24-5-5-5z"
              />
            </svg>
          </div>

          <!-- Detail Hasil BMI & BMR -->
          <div class="flex flex-col items-start">
            <span
              class="bg-[#D9EF78] text-[#213D34] text-[15px] font-semibold px-4 py-1.5 rounded-full"
            >
              Hasil BMI Kamu Adalah:
            </span>

            <div id="bmiResult" class="text-[80px] font-black my-2 text-[#213D34] font-rubik">
              0.0
            </div>

            <div
              id="bmiCategory"
              class="font-bold text-[22px] uppercase -mt-4 text-[#213D34]"
            >
              NORMAL - IDEAL
            </div>

            <p
              class="flex items-center justify-center gap-1.5 text-sm font-bold mt-3 text-gray-700"
            >
              <!-- Icon Flame -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="w-5 h-5 text-[#213D34]"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                  d="M12 10.941c2.333 -3.308 .167 -7.823 -1 -8.941c0 3.395 -2.235 5.299 -3.667 6.706c-1.43 1.408 -2.333 3.294 -2.333 5.588c0 3.704 3.134 6.706 7 6.706c3.866 0 7 -3.002 7 -6.706c0 -1.712 -1.232 -4.403 -2.333 -5.588c-2.084 3.353 -3.257 3.353 -4.667 2.235"
                />
              </svg>

              <!-- Teks & Hasil BMR -->
              <span class="text-[#213D34] font-karla font-semibold">Min. Kalori:</span>
              <span id="bmrResult" class="text-[#213D34] font-karla font-semibold">0 kcal/hari</span>
            </p>
          </div>
        </div>

        <!-- Tombol Lanjut -->
        <a
          id="buttonToGizi"
          href="../kalkulatorgizi/gizi.html"
          class="block mt-8 w-full text-center bg-[#D9EF78] border-2 border-[#213D34] text-[#213D34] font-semibold text-[15px] py-3.5 rounded-full hover:bg-[#213D34] hover:text-white transition-all duration-300 ease-in-out"
        >
          Lihat Rekomendasi Makanan Gizi &rarr;
        </a>
      </div>
    </main>

    <!-- Library & Script -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      crossorigin="anonymous"
    ></script>

    <script src="../navigasi/navbar.js"></script>

    <script src="./bmi.js"></script>

    <script src="../smooth-scroll/smooth.js"></script>
    <script src="../smooth-scroll/smooth-tombol.js"></script>
  </body>
</html>
