<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substitusi Gizi</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style type="text/tailwindcss">
        @theme {
            --font-karla: "Karla", sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 font-karla text-gray-800 antialiased min-h-screen flex flex-col">
    
    <!-- Tempat Navbar Loaded -->
    <div id="navbar-container"></div>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 my-6">

        <div class="mb-6">
            <a
                href="/bmi/bmi.html"
                class="relative inline-flex items-center justify-center gap-2 overflow-hidden border-2 border-[#213D34] text-[#213D34] font-medium rounded-[24px] font-karla transition-colors duration-300 group px-6 h-[48px] hover:text-white"
            >
                <span
                class="absolute inset-0 bg-[#213D34] -translate-x-full group-hover:translate-x-0 transition-transform duration-700 ease-in-out"
                ></span>

                <span class="relative z-10 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                Kembali ke BMI
                </span>
            </a>
        </div>
        
        <div class="bg-[#213D34] text-white p-6 md:p-8 rounded-3xl shadow-sm mb-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <span class="text-xs uppercase tracking-wider text-emerald-300 font-semibold">Kebutuhan Energi Harian</span>
                    <h1 class="text-2xl md:text-3xl font-bold mt-1">Rekomendasi Asupan Gizi</h1>
                    <p class="text-xs text-gray-300 mt-1">BMR Dasar Anda: <span id="textBmr" class="font-bold text-white">0 kcal</span></p>
                </div>

                <div class="bg-white/10 p-4 rounded-2xl backdrop-blur-sm border border-white/10 w-full md:w-auto text-center">
                    <span class="text-[11px] text-gray-300 block">Target Kalori Harian (TDEE)</span>
                    <span id="textTdee" class="text-2xl font-extrabold text-emerald-400">0 kcal/hari</span>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-white/10">
                <label class="block text-xs font-medium text-emerald-200 mb-2">Sesuaikan Aktivitas Harian Anda:</label>
                <select id="selectAktivitas" class="w-full md:w-80 p-2.5 bg-white text-gray-800 text-sm rounded-xl focus:outline-none font-medium">
                    <option value="1.2">Jarang / Tidak Olahraga</option>
                    <option value="1.375">Aktivitas Ringan (Olahraga 1-3x/minggu)</option>
                    <option value="1.55">Aktivitas Sedang (Olahraga 3-5x/minggu)</option>
                    <option value="1.725">Aktivitas Berat (Olahraga 6-7x/minggu)</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <h2 class="text-xl font-bold text-[#213D34]">Menu Makanan yang Direkomendasikan</h2>
            <p class="text-xs text-gray-500">Perbandingan Opsi Sultan vs Opsi Hemat sesuai kategori gizi Anda</p>
        </div>

        <div id="food-container" class="grid grid-cols-1 gap-6">
            <!-- Card hasil render JS -->
        </div>

    </main>

    <!-- Library & Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" crossorigin="anonymous"></script>

    <script src="../navigasi/navbar.js"></script>

    <script src="./gizidata.js"></script>
    <script src="./giziscript.js"></script>

    <script src="../smooth-scroll/smooth.js"></script>
    <script src="../smooth-scroll/smooth-tombol.js"></script>
</body>
</html>
