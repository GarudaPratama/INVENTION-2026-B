<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --font-karla: "Karla", sans-serif;
      }
    </style>

    <title>Navigasi</title>
  </head>

  <body>
    <header class="mt-[20px]">
      <div class="flex items-center justify-between px-9">
        <!-- Logo -->
        <img
          src="./navigasi/Logo-9.png"
          alt=""
          class="w-[111px] h-[51px]"
        />

        <!-- Navigation -->
        <nav>
          <ul class="relative flex items-center gap-12">

            <!-- Active Pill -->
            <span
              id="pill"
              class="absolute h-[36px] bg-[#D9EF78] rounded-full transition-all duration-300 ease-out pointer-events-none"
            ></span>

            <!-- Beranda -->
            <li class="text-[#213D34] font-medium text-[16px] font-karla">
              <a
                href="/index.html"
                class="nav-link relative z-10 inline-block px-4 py-1.5 text-[#213D34] font-medium text-[16px] font-karla rounded-full"
              >
                Beranda
              </a>
            </li>

            <!-- Fitur -->
            <li
              id="btn-fitur"
              class="relative flex items-center gap-1 cursor-pointer select-none"
            >
              <div
                class="nav-link relative z-10 flex items-center gap-1 px-4 py-1.5 text-[#213D34] font-medium text-[16px] font-karla rounded-full"
              >
                <span>Fitur</span>

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                  stroke="currentColor"
                  class="w-4 h-4 transition-transform duration-300 text-[#213D34]"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m19.5 8.25-7.5 7.5-7.5-7.5"
                  />
                </svg>
              </div>

              <!-- Dropdown Fitur -->
              <ul
                class="absolute left-0 top-full mt-2 z-50 w-52 rounded-2xl border border-gray-100 bg-white p-2 shadow-xl opacity-0 invisible translate-y-2 transition-all duration-200 space-y-1"
              >
                <!-- Kalkulator BMI -->
                <li>
                  <a
                    href="/bmi/bmi.html"
                    class="group flex items-center gap-3 rounded-xl p-2.5 text-[#213D34] hover:bg-[#213D34] hover:text-white transition-colors"
                  >
                    <div
                      class="flex items-center justify-center w-9 h-9 rounded-lg bg-[#D9EF78] text-[#213D34] group-hover:bg-white"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        class="w-5 h-5"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M6.75 3.75h10.5A2.25 2.25 0 0 1 19.5 6v12a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 18V6a2.25 2.25 0 0 1 2.25-2.25Z"
                        />
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M8.25 7.5h7.5M8.25 11.25h1.5m2.25 0h1.5m2.25 0h0M8.25 15h1.5m2.25 0h1.5m2.25 0h0"
                        />
                      </svg>
                    </div>

                    <div>
                      <p class="font-medium">Kalkulator</p>
                      <p class="text-xs opacity-60 group-hover:opacity-80">
                        Cek BMI
                      </p>
                    </div>
                  </a>
                </li>

                <!-- Cek Gizi -->
                <li>
                  <a
                    href="/kalkulatorgizi/gizi.html"
                    class="group flex items-center gap-3 rounded-xl p-2.5 text-[#213D34] hover:bg-[#213D34] hover:text-white transition-colors"
                  >
                    <div
                      class="flex items-center justify-center w-9 h-9 rounded-lg bg-[#D9EF78] text-[#213D34] group-hover:bg-white"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        class="w-5 h-5"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M12 3.75c-4.556 0-8.25 3.694-8.25 8.25s3.694 8.25 8.25 8.25 8.25-3.694 8.25-8.25S16.556 3.75 12 3.75Z"
                        />
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M12 7.5v4.5l3 1.5"
                        />
                      </svg>
                    </div>

                    <div>
                      <p class="font-medium">Cek Gizi</p>
                      <p class="text-xs opacity-60 group-hover:opacity-80">
                        Cek status gizi
                      </p>
                    </div>
                  </a>
                </li>
              </ul>
            </li>

            <!-- Artikel -->
            <li class="text-[#213D34] font-medium text-[16px] font-karla">
              <a
                href="/artikel/artikel.html"
                class="nav-link relative z-10 inline-block px-4 py-1.5 text-[#213D34] font-medium text-[16px] font-karla rounded-full"
              >
                Artikel
              </a>
            </li>

            <!-- Tentang Kami -->
            <li
              class="text-[#213D34] font-medium text-[16px] font-karla"
            >
              Tentang Kami
            </li>

            <!-- Kontak -->
            <li
              class="text-[#213D34] font-medium text-[16px] font-karla"
            >
              Kontak
            </li>
          </ul>
        </nav>

        <!-- Button BMI -->
        <div>
          <button
            onclick="window.location.href='./bmi/bmi.html'"
            class="relative overflow-hidden border-2 border-[#213D34] text-[#213D34] font-medium rounded-[24px] font-karla transition-colors duration-300 group w-[170px] h-[48px] hover:text-white cursor-pointer"
          >
            <span
              class="absolute inset-0 bg-[#213D34] -translate-x-full group-hover:translate-x-0 transition-transform duration-700 ease-in-out"
            ></span>

            <span class="relative z-10">
              Cek BMI
            </span>
          </button>
        </div>
      </div>
    </header>
  </body>
</html>
