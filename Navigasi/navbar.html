<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- link untuk font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <!-- link untuk tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- konfigurasi tailwind untuk font poppins -->
    <style type="text/tailwindcss">
      @theme {
        --font-karla: "Karla", sans-serif;
      }
    </style>

    <title>Navigasi</title>
  </head>
  <body>
    <header class="mt-[25px]">
      <div class="flex items-center justify-between px-8">
        <!-- untuk logo -->
        <img src="./Logo (9).png" alt="" class="w-[111px] h-[51px]" />
        <nav>
          <ul class="flex items-center gap-12">
            <li class="text-[#213D34] font-[500] text-[16px]">Beranda</li>

            <li class="flex items-center gap-1">
              <span class="text-[#213D34] font-[500] text-[16px]">Fitur</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-up w-4 h-4 transition-transform duration-300 group-open:rotate-180 text-[#213D34]"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M6 15l6 -6l6 6" />
              </svg>
            </li>

            <li class="text-[#213D34] font-[500] text-[16px]">Artikel</li>
            <li class="text-[#213D34] font-[500] text-[16px]">Tentang Kami</li>
            <li class="text-[#213D34] font-[500] text-[16px]">Kontak</li>
          </ul>
        </nav>
        <div class="">
          <button
            class="bg-[#213D34] w-[170px] h-[48px] rounded-[24px] text-white font-[500] text-[16px] flex items-center justify-center gap-2"
          >
            Coba Kalkulator
          </button>
        </div>
      </div>
    </header>

    
  </body>
</html>
