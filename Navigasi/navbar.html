<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- link untuk font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <!-- link untuk tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- konfigurasi tailwind untuk font karla -->
    <style type="text/tailwindcss">
      @theme {
        --font-karla: "Karla", sans-serif;
      }
    </style>

    <title>Navigasi</title>
  </head>
  <body>
    <header class="mt-[20px]">
      <div class="flex items-center justify-between px-9 max-md:px-6 max-sm:px-4">
        <!-- untuk logo -->
         <a href="/index.html" class="inline-block overflow-hidden rounded-2xl group">
          <img
            src="./Navigasi/Logo-9.png"
            alt=""
            class="w-[111px] h-[51px] max-sm:w-[90px] max-sm:h-auto"
          />
         </a>

        <!-- ================= NAV DESKTOP (hilang di tablet & HP) ================= -->
        <nav class="max-md:hidden">
          <ul class="ml-10 flex items-center gap-12">
            <li class="text-[#213D34] font-medium text-[16px] font-karla">
              <a href="/index.html">Beranda</a>
            </li>

            <li
              id="btn-fitur"
              class="relative flex items-center gap-1 cursor-pointer select-none"
            >
              <div
                class="flex items-center gap-1 text-[#213D34] font-medium text-[16px] font-karla"
              >
                <span>Fitur</span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="w-4 h-4 transition-transform duration-300 text-[#213D34]"
                >
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M6 9l6 6l6 -6" />
                </svg>
              </div>

              <!-- yang tampil di dropdown -->
              <ul
                class="absolute left-0 top-full mt-2 z-50 w-52 rounded-2xl border border-gray-100 bg-white p-2 shadow-xl opacity-0 invisible translate-y-2 transition-all duration-200 space-y-1"
              >
                <li>
                  <a
                    href="/BMI/bmi.html"
                    class="group flex items-center gap-3 rounded-xl p-2.5 text-[#213D34] hover:bg-[#213D34] hover:text-white transition-colors"
                  >
                    <span
                      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-[#213D34]/10 group-hover:bg-white/20"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-calculator"
                      >
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path
                          d="M4 5a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -14"
                        />
                        <path
                          d="M8 8a1 1 0 0 1 1 -1h6a1 1 0 0 1 1 1v1a1 1 0 0 1 -1 1h-6a1 1 0 0 1 -1 -1l0 -1"
                        />
                        <path d="M8 14l0 .01" />
                        <path d="M12 14l0 .01" />
                        <path d="M16 14l0 .01" />
                        <path d="M8 17l0 .01" />
                        <path d="M12 17l0 .01" />
                        <path d="M16 17l0 .01" />
                      </svg>
                    </span>
                    <div>
                      <p class="font-bold font-karla text-[16px]">NutriCalc</p>
                      <p class="text-[14px] font-karla font-medium opacity-70 leading-none">
                        Hitung kebutuhan gizi Anda
                      </p>
                    </div>
                  </a>
                </li>

                <li>
                  <a
                    href="/finder/finder.html"
                    class="group flex items-center gap-3 rounded-xl p-2.5 text-[#213D34] hover:bg-[#213D34] hover:text-white transition-colors"
                  >
                    <span
                      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-[#213D34]/10 group-hover:bg-white/20"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-clipboard-list"
                      >
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path
                          d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2"
                        />
                        <path
                          d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2"
                        />
                        <path d="M9 12l.01 0" />
                        <path d="M13 12l2 0" />
                        <path d="M9 16l.01 0" />
                        <path d="M13 16l2 0" />
                      </svg>
                    </span>
                    <div>
                      <p class="font-bold font-karla text-[16px]">GiziFinder</p>
                      <p class="text-[14px] font-karla font-medium opacity-70 leading-none w-36">
                        Temukan pangan sehat di sekitarmu.
                      </p>
                    </div>
                  </a>
                </li>
              </ul>
            </li>

            <li class="text-[#213D34] font-medium text-[16px] font-karla">
              <a href="/artikel/artikel.html">Artikel</a>
            </li>
          </ul>
        </nav>

        <!-- tombol cek BMI desktop (hilang di tablet & HP) -->
        <div class="max-md:hidden">
          <button
            onclick="window.location.href='/BMI/bmi.html'"
            class="relative overflow-hidden border-2 border-[#213D34] text-[#213D34] font-medium rounded-[24px] font-karla transition-colors duration-300 group w-[170px] h-[48px] hover:text-white cursor-pointer"
          >
            <!-- layer warna latar yang menyapu -->
            <span
              class="absolute inset-0 bg-[#213D34] -translate-x-full group-hover:translate-x-0 transition-transform duration-700 ease-in-out"
            ></span>

            <!-- teks tombol (z-10 agar tetap berada di atas layer warna) -->
            <span class="relative z-10">Cek BMI</span>
          </button>
        </div>

        <!-- tombol hamburger (hanya muncul di tablet & HP) -->
        <button
          id="btn-hamburger"
          class="hidden max-md:flex items-center justify-center w-11 h-11 rounded-xl text-[#213D34] hover:bg-[#213D34]/10 cursor-pointer"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="w-6 h-6"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M4 6l16 0" />
            <path d="M4 12l16 0" />
            <path d="M4 18l16 0" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ============================================================ -->
    <!-- MENU KHUSUS TABLET & HP                                       -->
    <!-- ============================================================ -->
    <div class="hidden max-md:block">
      <!-- latar belakang blur (muncul saat menu terbuka) -->
      <div
        id="backdrop"
        class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300"
      ></div>

      <!-- panel menu yang turun dari atas -->
      <div
        id="mobile-menu"
        class="fixed inset-x-0 top-0 z-50 bg-[#F1F2ED] rounded-b-[32px] shadow-sm transition-transform duration-300 -translate-y-full"
      >
        <!-- baris atas: logo + tombol close -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <img
            src="./Navigasi/Logo-9.png"
            alt=""
            class="w-[111px] h-[51px] max-sm:w-[90px] max-sm:h-auto"
          />
          <button
            id="btn-close"
            class="flex items-center justify-center w-11 h-11 rounded-xl text-[#213D34] hover:bg-[#213D34]/10 cursor-pointer"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="w-6 h-6"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M18 6l-12 12" />
              <path d="M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- isi menu -->
        <ul class="px-6 py-4 space-y-1">
          <li>
            <a
              href="/index.html"
              class="block rounded-xl px-3 py-3 text-[#213D34] font-medium text-[16px] font-karla hover:bg-[#213D34]/10"
            >
              Beranda
            </a>
          </li>

          <li>
            <button
              id="btn-fitur-mobile"
              class="flex w-full items-center justify-between rounded-xl px-3 py-3 text-[#213D34] font-medium text-[16px] font-karla hover:bg-[#213D34]/10 cursor-pointer select-none"
            >
              <span>Fitur</span>
              <svg
                id="icon-fitur-mobile"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="w-4 h-4 transition-transform duration-300"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M6 9l6 6l6 -6" />
              </svg>
            </button>

            <!-- submenu fitur (terbuka saat "Fitur" diklik) -->
            <ul
              id="submenu-mobile"
              class="hidden mt-1 ml-3 space-y-1 border-l-2 border-[#213D34]/10 pl-3"
            >
              <li>
                <a
                  href="/BMI/bmi.html"
                  class="block rounded-xl px-3 py-2 text-[#213D34] hover:bg-[#213D34] hover:text-white transition-colors"
                >
                  <p class="font-bold font-karla text-[16px]">NutriCalc</p>
                  <p class="text-[14px] font-karla font-medium opacity-70">
                    Hitung kebutuhan gizi Anda
                  </p>
                </a>
              </li>
              <li>
                <a
                  href="/finder/finder.html"
                  class="block rounded-xl px-3 py-2 text-[#213D34] hover:bg-[#213D34] hover:text-white transition-colors"
                >
                  <p class="font-bold font-karla text-[16px]">GiziFinder</p>
                  <p class="text-[14px] font-karla font-medium opacity-70">
                    Temukan pangan sehat di sekitarmu.
                  </p>
                </a>
              </li>
            </ul>
          </li>

          <li>
            <a
              href="/artikel/artikel.html"
              class="block rounded-xl px-3 py-3 text-[#213D34] font-medium text-[16px] font-karla hover:bg-[#213D34]/10"
            >
              Artikel
            </a>
          </li>
        </ul>

        <!-- tombol cek BMI di dalam menu -->
        <div class="px-6 pb-6 pt-2">
          <button
            onclick="window.location.href='/BMI/bmi.html'"
            class="relative overflow-hidden border-2 border-[#213D34] text-[#213D34] font-medium rounded-[24px] font-karla transition-colors duration-300 group w-full h-[48px] hover:text-white cursor-pointer"
          >
            <span
              class="absolute inset-0 bg-[#213D34] -translate-x-full group-hover:translate-x-0 transition-transform duration-700 ease-in-out"
            ></span>
            <span class="relative z-10">Cek BMI</span>
          </button>
        </div>
      </div>
    </div>

    <!-- jQuery HARUS di atas navbar.js -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script src="navbar.js"></script>
  </body>
</html>
