<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- link untuk font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <!-- link untuk tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- konfigurasi tailwind untuk font poppins -->
    <style type="text/tailwindcss">
      @theme {
        --font-karla: "Karla", sans-serif;
      }
    </style>

    <title>Navigasi</title>
  </head>
  <body>
    <header class="mt-[25px]">
      <div class="flex items-center justify-between px-8">
        <!-- untuk logo -->
        <img src="./Logo (9).png" alt="" class="w-[111px] h-[51px]" />
        <nav>
          <ul class="flex items-center gap-12">
            <li class="text-[#213D34] font-[500] text-[16px]">Beranda</li>

            <li id="btn-fitur" class="flex items-center gap-1">
              <div class="flex items-center gap-1 text-[#213D34] font-[500] text-[16px]">
                <span>Fitur</span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-up w-4 h-4 transition-transform duration-300 text-[#213D34]"
                >
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M6 15l6 -6l6 6" />
                </svg>
              </div>

              <ul class="absolute left-0 top-full z-50 min-w-[180px] rounded-xl border border-gray-100 bg-white p-2 shadow-xl opacity-0 invisible translate-y-2 transition-all duration-200 group-hover:opacity-100 group-hover:visible group-hover:translate-y-0">
                <li>
                  <a href="#" class="block rounded-lg px-4 py-2.5 text-[14px] text-[#213D34] hover:bg-[#213D34]/5 transition-colors">Fitur 1</a>
                </li>
                <li>
                  <a href="#" class="block rounded-lg px-4 py-2.5 text-[14px] text-[#213D34] hover:bg-[#213D34]/5 transition-colors">Fitur 2</a>
                </li>
                <li>
                  <a href="#" class="block rounded-lg px-4 py-2.5 text-[14px] text-[#213D34] hover:bg-[#213D34]/5 transition-colors">Fitur 3</a>
                </li>
              </ul>
            </li>

            <li class="text-[#213D34] font-[500] text-[16px]">Artikel</li>
            <li class="text-[#213D34] font-[500] text-[16px]">Tentang Kami</li>
            <li class="text-[#213D34] font-[500] text-[16px]">Kontak</li>
          </ul>
        </nav>
        <div class="">
          <button
            class="bg-[#213D34] w-[170px] h-[48px] rounded-[24px] text-white font-[500] text-[16px] flex items-center justify-center gap-2"
          >
            Coba Kalkulator
          </button>
        </div>
      </div>
    </header>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    ></script>
    
    <script src="navbar.js"></script>
  </body>
</html>
